<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} - How Companies Were Built{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
{% if page.youtube_id %}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"VideoObject","name":"{{ page.title }}","description":"{{ page.description }}","thumbnailUrl":"https://i.ytimg.com/vi/{{ page.youtube_id }}/maxresdefault.jpg","uploadDate":"{{ page.date | date_to_xmlschema }}","embedUrl":"https://www.youtube.com/embed/{{ page.youtube_id }}","url":"https://www.youtube.com/watch?v={{ page.youtube_id }}"}
</script>
{% endif %}
</head>
<body>
<header class="site-header">
  <a class="logo" href="/">From The <span>Beginning</span></a>
  <nav><a href="/">Home</a> <a href="/stories/">Stories</a> <a href="/about/">About</a> <a href="{{ site.youtube_channel }}" target="_blank" rel="noopener">YouTube</a></nav>
</header>
<main>{{ content }}</main>
<footer>
  <p>More stories of how things began on <a href="{{ site.youtube_channel }}">From The Beginning on YouTube</a>.</p>
  <p>&copy; {{ site.time | date: '%Y' }} From The Beginning. All rights reserved.</p>
</footer>
</body>
</html>
