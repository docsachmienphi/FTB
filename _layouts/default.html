<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} - How Companies Were Built{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ page.image | default: '/assets/images/banner.jpg' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ page.image | default: '/assets/images/banner.jpg' | absolute_url }}">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css?v=12">
{% if page.youtube_id %}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"VideoObject","name":"{{ page.title }}","description":"{{ page.description }}","thumbnailUrl":"https://i.ytimg.com/vi/{{ page.youtube_id }}/maxresdefault.jpg","uploadDate":"{{ page.date | date_to_xmlschema }}","embedUrl":"https://www.youtube.com/embed/{{ page.youtube_id }}","url":"https://www.youtube.com/watch?v={{ page.youtube_id }}"}
</script>
{% endif %}
</head>
<body>
<header class="site-header">
  <a class="logo" href="/"><img class="logo-mark" src="/assets/images/logo-header.png" alt="FTB logo">From The <span>Beginning</span></a>
  <nav><a href="/">Home</a> <a href="/stories/">Stories</a> <a href="/about/">About</a> <a href="{{ site.youtube_channel }}" target="_blank" rel="noopener"><svg width="23" height="16" viewBox="0 0 28 20" style="vertical-align:-2px;margin-right:6px" aria-hidden="true"><path fill="#FF0000" d="M27.4 3.1c-.3-1.3-1.3-2.3-2.6-2.6C22.6 0 14 0 14 0S5.4 0 3.2.5C1.9.8.9 1.8.6 3.1C0 5.3 0 10 0 10s0 4.7.6 6.9c.3 1.3 1.3 2.3 2.6 2.6C5.4 20 14 20 14 20s8.6 0 10.8-.5c1.3-.3 2.3-1.3 2.6-2.6.6-2.2.6-6.9.6-6.9s0-4.7-.6-6.9z"/><path fill="#FFFFFF" d="M11.2 14.3V5.7L18.5 10l-7.3 4.3z"/></svg>YouTube</a></nav>
</header>
<main>{{ content }}</main>
<footer>
  <p>More stories of how things began on <a href="{{ site.youtube_channel }}">From The Beginning on YouTube</a>.</p>
  <p>&copy; {{ site.time | date: '%Y' }} From The Beginning. All rights reserved.</p>
</footer>
</body>
</html>
